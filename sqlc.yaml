version: "2"

sql:
  - engine: "postgresql"
    queries: "./data/queries/postgres"
    schema: "./data/migrations/postgres"
    gen:
      go:
        package: "dbqueries"
        out: "./internal/storage/postgres/dbqueries"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: false

          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true

          - db_type: "timestamptz"
            nullable: false
            go_type:
              type: "time.Time"
              pointer: false

          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
